[package]
name = "lepton-shell"
version = "0.2.0"
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Auth app-bar UI composed into uf-integrations ShellAuthMenu slot"

[dependencies]
leptos = { workspace = true }
leptos_router = { workspace = true }
lepton-auth = { workspace = true, default-features = false }
lepton-auth-ui = { workspace = true, default-features = false }
orbital-base-components = { workspace = true }
orbital-primitives = { workspace = true, default-features = false }
uf-product = { workspace = true, default-features = false }

[lints]
workspace = true

[features]
default = []
hydrate = ["leptos/hydrate", "lepton-auth/hydrate", "lepton-auth-ui/hydrate", "uf-product/hydrate"]
ssr = [
    "leptos/ssr",
    "leptos_router/ssr",
    "lepton-auth/ssr",
    "lepton-auth-ui/ssr",
    "uf-product/ssr"]
